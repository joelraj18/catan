<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- Always check for a newer page, so every player runs the same game -->
    <meta http-equiv="Cache-Control" content="no-cache" />
    <link rel="icon" type="image/svg+xml" href="%PUBLIC_URL%/favicon.svg" />
    <link rel="alternate icon" href="%PUBLIC_URL%/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f6f1" />
    <meta
      name="description"
      content="Catan in your browser: settle the island, trade resources and build your way to 10 victory points, for 3 to 4 players"
    />
    <script>
      // Set the theme before anything paints, so a dark page never flashes light.
      (function () {
        try {
          var saved = localStorage.getItem('catan-theme');
          var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        } catch (e) {}
      })();
    </script>
    <title>Catan · Settle, trade and build</title>
  </head>
  <body>
    <noscript>Please enable JavaScript to play Catan</noscript>
    <div id="root"></div>
  </body>
</html>
